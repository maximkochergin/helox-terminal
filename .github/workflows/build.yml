name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: compile
        shell: powershell
        run: .\build.ps1
      - name: package
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: helox-terminal
          path: dist/helox-terminal-v*.zip

# native settings tests belong on an interactive windows desktop, not a hosted runner.
