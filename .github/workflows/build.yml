name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: compile
        shell: powershell
        run: .\build.ps1
      - name: regression checks
        shell: powershell
        run: |
          .\bin\helox.exe check
          if ($LASTEXITCODE -ne 0) { throw 'regression checks failed' }
      - name: build recovery checks
        shell: powershell
        run: .\tests\build.ps1
      - name: cleanup safety checks
        shell: powershell
        run: .\tests\maintenance.ps1
      - name: uninstall orchestration checks
        shell: powershell
        run: .\tests\uninstall.ps1
      - name: package
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: helox-terminal
          path: dist/helox-terminal-v*.zip

# native settings tests belong on an interactive windows desktop, not a hosted runner.
