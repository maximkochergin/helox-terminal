name: bug report
description: report a reproducible problem with helox terminal
title: "bug: "
body:
  - type: input
    id: version
    attributes:
      label: version
      placeholder: "0.20.0 / windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: steps and result
      description: what you selected, what happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: diagnostics
      description: error, health --json or aim doctor --json output; remove device paths and personal information before posting. Include verify-package.ps1 output for extraction problems.
